<!-- Support Us page layout. Content comes from data/sponsors.json and data/site.json -->
<div class="page-header">
    <div class="container">
        <h1 data-i18n="page.support"></h1>
    </div>
</div>

<section class="section container" id="partners" aria-labelledby="partners-title">
    <h2 id="partners-title" class="section-title" data-i18n="support.partners"></h2>
    <div id="partners-body" class="card-grid card-grid-3"></div>
</section>

<section class="section section-alt" id="sponsors" aria-labelledby="sponsors-title">
    <div class="container">
        <h2 id="sponsors-title" class="section-title" data-i18n="support.sponsors"></h2>
        <div id="sponsors-body"></div>
    </div>
</section>

<section class="section container" id="become-sponsor" aria-labelledby="become-title">
    <div class="cta-banner">
        <div>
            <h2 id="become-title" data-i18n="support.becomeSponsor"></h2>
            <p data-i18n="support.becomeSponsorText"></p>
            <p id="sponsor-contact"></p>
        </div>
        <a class="btn btn-gold" data-site-href="sponsorFormUrl" target="_blank" rel="noopener"><span data-i18n="support.becomeSponsor"></span></a>
    </div>
</section>

<section class="section section-alt" id="volunteer" aria-labelledby="volunteer-title">
    <div class="container">
        <h2 id="volunteer-title" class="section-title" data-i18n="support.volunteer"></h2>
        <div id="volunteer-body"></div>
        <p><a class="btn btn-primary" data-site-href="volunteerFormUrl" target="_blank" rel="noopener"><span data-i18n="btn.volunteer"></span></a></p>
    </div>
</section>
