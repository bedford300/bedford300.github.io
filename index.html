    <!-- Fonts are self-hosted. Only the body font is preloaded. -->
    <link rel="preload" href="assets/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Core data used by every page: start downloading right away. -->
    <link rel="preload" href="data/i18n/languages.json" as="fetch" crossorigin>

    <link rel="preload" href="data/strings.en.json" as="fetch" crossorigin>
    <link rel="preload" href="data/image-manifest.json" as="fetch" crossorigin>

    <script>
        // Preload the Home hero photo (the largest thing on the first screen) only when
        // the visitor lands on the Home page. To change the hero photo, replace
        // assets/images/originals/site/hero.jpg with a new photo of the SAME name.
        (function () {
            var h = location.hash.replace('#', '');
            if (h && h !== 'home') return;
            var b = 'assets/images/optimized/site/hero-';
            var l = document.createElement('link');
            l.rel = 'preload';
            l.as = 'image';
            l.setAttribute('imagesrcset', b + '400.webp 400w, ' + b + '800.webp 800w, ' + b + '1600.webp 1600w');
            l.setAttribute('imagesizes', '100vw');
            l.setAttribute('fetchpriority', 'high');
            document.head.appendChild(l);
        })();
    </script>

    <!--
        VERSION: after changing any CSS or JS file, change "v=..." on BOTH lines below
        to a new value (e.g. today's date). This makes visitors' browsers load the new files.
        All other code and page files pick the version up from main.js automatically.
    -->
    <link rel="stylesheet" href="assets/css/style.css?v=2026.10.07e">
